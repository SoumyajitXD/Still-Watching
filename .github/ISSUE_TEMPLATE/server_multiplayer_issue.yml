name: Server or multiplayer issue
description: Dedicated server, LAN, connection, desync, permissions, voice chat, or multiplayer-only problem.
title: "[Server/Multiplayer]: "
labels:
  - multiplayer
  - needs-triage

body:
  - type: markdown
    attributes:
      value: |
        Use this for problems that only happen on a dedicated server, LAN, or multiplayer session. Use Crash report if the server/client crashes.

  - type: checkboxes
    id: server-preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: Client and server are using the same Still Watching version unless explained below.
          required: true
        - label: This is not a general gameplay bug that also happens in singleplayer.
          required: true

  - type: dropdown
    id: server-problem-type
    attributes:
      label: Problem type
      options:
        - Server will not start
        - Client cannot join
        - Disconnect/kick
        - Multiplayer-only gameplay bug
        - Desync/rollback
        - Permissions/teams/quests
        - Simple Voice Chat
        - Server pack/files
        - LAN issue
        - Other
    validations:
      required: true

  - type: input
    id: server-pack-version
    attributes:
      label: Still Watching version
      placeholder: "Example: V1.0.x / CurseForge server pack file"
    validations:
      required: true

  - type: dropdown
    id: server-launcher
    attributes:
      label: Client launcher
      options:
        - CurseForge App
        - Prism Launcher
        - ATLauncher
        - Modrinth App
        - Other
    validations:
      required: true

  - type: input
    id: server-host
    attributes:
      label: Server host/environment
      placeholder: "Self-hosted / BisectHosting / other host / LAN"
    validations:
      required: true

  - type: input
    id: server-minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "1.20.1"
    validations:
      required: true

  - type: input
    id: server-forge-version
    attributes:
      label: Forge version
      placeholder: "Forge 47.x.x"
    validations:
      required: true

  - type: input
    id: server-java-version
    attributes:
      label: Server Java version
      placeholder: "Java 17"
    validations:
      required: true

  - type: input
    id: server-os
    attributes:
      label: Server operating system
      placeholder: "Linux distro / Windows Server / host panel if unknown"
    validations:
      required: true

  - type: input
    id: server-client-os
    attributes:
      label: Client operating system
      placeholder: "Windows 11 / macOS / Linux distro"
    validations:
      required: true

  - type: input
    id: server-player-count
    attributes:
      label: Player count when it happened
      placeholder: "Example: 1/10, 4/10"
    validations:
      required: true

  - type: textarea
    id: server-steps
    attributes:
      label: Steps to reproduce
      description: Include what the server does, what the client does, and when the problem appears.
      placeholder: |
        1. Start server...
        2. Client joins...
        3. Player does...
        4. Problem happens...
    validations:
      required: true

  - type: textarea
    id: server-expected-result
    attributes:
      label: Expected result
      placeholder: "Expected the server/client to..."
    validations:
      required: true

  - type: textarea
    id: server-logs
    attributes:
      label: Server and client logs
      description: Attach server latest.log/debug.log and affected client latest.log. Required for startup, join, disconnect, voice chat, or permission errors.
      placeholder: "Drag and drop logs here, or paste links."
    validations:
      required: true

  - type: textarea
    id: server-config-changes
    attributes:
      label: Server config changes or extra content
      description: List edited server configs, removed mods, extra mods/plugins, datapacks, claims/teams setup, or write "None".
      placeholder: "None"
    validations:
      required: true
