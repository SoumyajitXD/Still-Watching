name: Workflow Lint

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Check workflow policy
        run: |
          python <<'PY'
          from pathlib import Path
          import sys
          import yaml

          workflow_dir = Path(".github/workflows")
          files = sorted(workflow_dir.glob("*.yml")) + sorted(workflow_dir.glob("*.yaml"))
          errors = []

          unsafe_permission_values = {"write-all"}
          unsafe_write_scopes = {
              "actions",
              "checks",
              "contents",
              "deployments",
              "discussions",
              "issues",
              "packages",
              "pages",
              "pull-requests",
              "repository-projects",
              "security-events",
              "statuses",
          }

          def add_error(path, message):
              errors.append(f"{path}: {message}")

          def get_trigger(data):
              if isinstance(data, dict):
                  return data.get("on", data.get(True))
              return None

          def check_permissions(path, location, permissions):
              if permissions is None:
                  return
              if isinstance(permissions, str):
                  if permissions in unsafe_permission_values:
                      add_error(path, f"{location} uses unsafe broad permissions: {permissions}")
                  return
              if not isinstance(permissions, dict):
                  add_error(path, f"{location} permissions must be a mapping or a supported string")
                  return
              for scope, access in permissions.items():
                  if access == "write" and scope in unsafe_write_scopes:
                      add_error(path, f"{location} grants write permission for {scope}")

          if not files:
              add_error(workflow_dir, "no workflow files found")

          for path in files:
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  add_error(path, f"invalid YAML: {exc}")
                  continue

              if not isinstance(data, dict):
                  add_error(path, "workflow must be a YAML mapping")
                  continue

              if not data.get("name"):
                  add_error(path, "missing name")

              if get_trigger(data) is None:
                  add_error(path, "missing trigger")

              jobs = data.get("jobs")
              if not isinstance(jobs, dict) or not jobs:
                  add_error(path, "missing jobs")

              check_permissions(path, "workflow", data.get("permissions"))

              if isinstance(jobs, dict):
                  for job_name, job in jobs.items():
                      if isinstance(job, dict):
                          check_permissions(path, f"job {job_name!r}", job.get("permissions"))

          if errors:
              print("Workflow policy check failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print(f"Checked {len(files)} workflow file(s).")
          PY
