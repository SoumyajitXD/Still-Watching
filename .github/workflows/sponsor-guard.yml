name: Sponsor Guard

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sponsor-guard:
    name: Verify sponsor content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify sponsor content remains intact
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          SPONSOR_URL = "https://url-shortener.curseforge.com/AZDOs"
          SPONSOR_IMAGE_URL = "https://media.forgecdn.net/attachments/description/1420406/description_0434b1be-41ee-4fa8-a2f5-177b2fe87c95.png"
          README_START = "<!-- sponsor:bisecthosting:start -->"
          README_END = "<!-- sponsor:bisecthosting:end -->"

          errors = []

          def read_text(path: str) -> str:
              try:
                  return Path(path).read_text(encoding="utf-8")
              except FileNotFoundError:
                  errors.append(f"Missing required file: {path}")
                  return ""

          def quoted_url_pattern(attribute: str, url: str) -> str:
              return rf"{attribute}=[\"']{re.escape(url)}[\"']"

          readme = read_text("README.md")
          curseforge_description = read_text("curseforge-description.html")

          if readme:
              has_start = README_START in readme
              has_end = README_END in readme

              if has_start != has_end:
                  errors.append("README sponsor marker pair is damaged; start/end markers must remain together.")
              elif not has_start and not has_end:
                  errors.append("README sponsor markers were removed.")
              else:
                  start_index = readme.index(README_START)
                  end_index = readme.index(README_END)
                  if start_index > end_index:
                      errors.append("README sponsor markers are out of order.")
                  else:
                      sponsor_block = readme[start_index:end_index + len(README_END)]
                      if SPONSOR_URL not in sponsor_block:
                          errors.append("README sponsor block is missing the required sponsor URL.")
                      if SPONSOR_IMAGE_URL not in sponsor_block:
                          errors.append("README sponsor block is missing the current sponsor image URL.")
                      if not re.search(
                          rf"<a\b[^>]*{quoted_url_pattern('href', SPONSOR_URL)}[^>]*>.*?"
                          rf"<img\b[^>]*{quoted_url_pattern('src', SPONSOR_IMAGE_URL)}[^>]*>.*?</a>",
                          sponsor_block,
                          re.IGNORECASE | re.DOTALL,
                      ):
                          errors.append("README sponsor block must keep the sponsor image linked to the required sponsor URL.")

          if curseforge_description:
              if SPONSOR_URL not in curseforge_description:
                  errors.append("CurseForge description is missing the required sponsor URL.")
              if SPONSOR_IMAGE_URL not in curseforge_description:
                  errors.append("CurseForge description is missing the current sponsor image URL.")
              if not re.search(
                  rf"<a\b[^>]*{quoted_url_pattern('href', SPONSOR_URL)}[^>]*>.*?"
                  rf"<img\b[^>]*{quoted_url_pattern('src', SPONSOR_IMAGE_URL)}[^>]*>",
                  curseforge_description,
                  re.IGNORECASE | re.DOTALL,
              ):
                  errors.append("CurseForge sponsor image must remain linked to the required sponsor URL.")

          if errors:
              print("Sponsor guard failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print("Sponsor guard passed: required sponsor content remains intact.")
