name: Security Hygiene

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-hygiene:
    name: Scan for accidental secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan text files for strong secret patterns
        shell: python
        run: |
          import math
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          SKIP_SUFFIXES = {
              ".7z", ".avif", ".bmp", ".class", ".dll", ".dylib", ".eot",
              ".exe", ".gif", ".gz", ".ico", ".jar", ".jpeg", ".jpg",
              ".lockb", ".mp3", ".mp4", ".ogg", ".otf", ".pdf", ".png",
              ".pyc", ".rar", ".so", ".tar", ".tgz", ".ttf", ".wasm",
              ".webm", ".webp", ".woff", ".woff2", ".xz", ".zip",
          }

          MAX_FILE_BYTES = 2 * 1024 * 1024

          SECRET_PATTERNS = [
              (
                  "GitHub token",
                  re.compile(r"(?<![A-Za-z0-9_])(?:gh[pousr]_[A-Za-z0-9_]{36}|github_pat_[A-Za-z0-9_]{22}_[A-Za-z0-9_]{59})(?![A-Za-z0-9_])"),
              ),
              (
                  "Discord webhook",
                  re.compile(r"https://discord(?:app)?\.com/api/webhooks/\d{17,20}/[A-Za-z0-9._-]{60,}"),
              ),
              (
                  "private key block",
                  re.compile(r"-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----"),
              ),
              (
                  "generic API key assignment",
                  re.compile(
                      r"(?i)\b(?:api[_-]?key|access[_-]?key|secret[_-]?key|client[_-]?secret|auth[_-]?token|bearer[_-]?token)\b"
                      r"\s*[:=]\s*"
                      r"['\"]?([A-Za-z0-9][A-Za-z0-9_./+=-]{31,})['\"]?"
                  ),
              ),
              (
                  "password assignment",
                  re.compile(
                      r"(?i)\b(?:password|passwd|pwd)\b"
                      r"\s*[:=]\s*"
                      r"['\"]([^'\"\s]{12,})['\"]"
                  ),
              ),
          ]

          PLACEHOLDER_WORDS = {
              "changeme", "dummy", "example", "fake", "placeholder", "redacted",
              "sample", "test", "todo", "your", "xxxxx", "xxxxxx",
          }

          ALLOWED_CONTEXT = (
              "example.com",
              "img.shields.io",
              "curseforge.com",
              "modrinth.com",
              "docs.github.com",
              "placeholder",
              "redacted",
          )

          def is_probably_text(path: Path) -> bool:
              if path.suffix.lower() in SKIP_SUFFIXES:
                  return False
              try:
                  data = path.read_bytes()[:4096]
              except OSError:
                  return False
              return b"\0" not in data

          def shannon_entropy(value: str) -> float:
              if not value:
                  return 0.0
              return -sum((value.count(ch) / len(value)) * math.log2(value.count(ch) / len(value)) for ch in set(value))

          def looks_placeholder(value: str, line: str) -> bool:
              lowered = f"{value} {line}".lower()
              if any(word in lowered for word in PLACEHOLDER_WORDS):
                  return True
              if any(context in lowered for context in ALLOWED_CONTEXT):
                  return True
              compact = re.sub(r"[^a-z0-9]", "", value.lower())
              if not compact:
                  return True
              return len(set(compact)) <= 4

          def strong_generic_secret(kind: str, value: str, line: str) -> bool:
              if looks_placeholder(value, line):
                  return False
              if kind == "password assignment":
                  return len(value) >= 12 and shannon_entropy(value) >= 3.0
              return len(value) >= 32 and shannon_entropy(value) >= 3.5

          def tracked_files() -> list[Path]:
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [Path(item.decode("utf-8")) for item in raw.split(b"\0") if item]

          findings = []

          for path in tracked_files():
              if not path.is_file() or not is_probably_text(path):
                  continue
              try:
                  if path.stat().st_size > MAX_FILE_BYTES:
                      continue
                  lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              except OSError:
                  continue

              for line_number, line in enumerate(lines, start=1):
                  for kind, pattern in SECRET_PATTERNS:
                      match = pattern.search(line)
                      if not match:
                          continue

                      if kind in {"generic API key assignment", "password assignment"}:
                          value = match.group(1)
                          if not strong_generic_secret(kind, value, line):
                              continue

                      findings.append((path.as_posix(), line_number, kind))

          if findings:
              print("Strong secret-looking values were found. Rotate any real exposed secrets before removing them from git history.")
              for file_path, line_number, kind in findings:
                  print(f"::error file={file_path},line={line_number}::{kind} detected")
              sys.exit(1)

          print("No strong accidental secret patterns found in tracked text files.")
