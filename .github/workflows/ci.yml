name: CI

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "installation-guide.md"
      - "latest-modlist.md"
      - "curseforge-description.html"
      - "CHANGELOG.md"
      - "data/**"
      - "docs/**"
      - ".github/scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "installation-guide.md"
      - "latest-modlist.md"
      - "curseforge-description.html"
      - "CHANGELOG.md"
      - "data/**"
      - "docs/**"
      - ".github/scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Run validation
        run: python .github/scripts/validate.py all
