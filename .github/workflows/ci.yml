name: CI

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "installation-guide.md"
      - "curseforge-description.html"
      - "latest-modlist.md"
      - "LICENSE"
      - "Releases/**"
      - "Screenshots/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/scripts/validate.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "README.md"
      - "installation-guide.md"
      - "curseforge-description.html"
      - "latest-modlist.md"
      - "LICENSE"
      - "Releases/**"
      - "Screenshots/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/scripts/validate.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet PyYAML

      - name: Run all repository validation checks
        run: python .github/scripts/validate.py all
