name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-health:
    name: Repository health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Prepare generated-doc compatibility path
        shell: bash
        run: |
          if [[ ! -f latest-modlist.md ]]; then
            cat > latest-modlist.md <<'EOF'
          # Mod List

          The generated mod list is not tracked in this repository snapshot.
          Use the official CurseForge project page for the current playable modpack files:
          https://www.curseforge.com/minecraft/modpacks/still-watching
          EOF
          fi

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          for check in yaml text html links facts sponsor archives; do
            python .github/scripts/validate.py "$check"
          done

      - name: Check generated docs are stable when sources exist
        run: python .github/scripts/generate_docs.py --check

      - name: Check git whitespace
        run: git diff --check
