name: Still Watching CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      external_links:
        description: Probe external HTTP(S) links during this manual run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  npm_config_audit: false
  npm_config_fund: false
  npm_config_update_notifier: false
  GOTOOLCHAIN: local

jobs:
  validator-quality:
    name: Validator quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Compile validators and parse metadata
        run: |
          set -euo pipefail
          python3 -m compileall -q .github/ci
          python3 -m json.tool .github/ci/project-metadata.json >/dev/null

      - name: Run validator regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/ci -p 'test_*.py' -v

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Validate metadata, links, modlist, HTML and hygiene
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py all

  release-archive:
    name: Release archive integrity
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check immutable release ZIP structures and current manifest
        run: |
          set -euo pipefail
          python3 .github/ci/validate_archives.py

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install pinned Markdown linter
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --prefix "$RUNNER_TEMP/markdownlint" --no-save \
              --package-lock=false --ignore-scripts markdownlint-cli2@0.18.1; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install markdownlint-cli2 after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Lint every maintained Markdown file with repository config
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/markdownlint/node_modules/.bin/markdownlint-cli2" \
            "**/*.md" "!Releases/**"

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install actionlint after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check workflow syntax and policy
        run: |
          set -euo pipefail
          actionlint .github/workflows/ci.yml
          python3 .github/ci/validate_repository.py workflow

  external-link-check:
    name: External link advisory
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.external_links)
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Probe external links without blocking CI
        run: |
          set -euo pipefail
          set +e
          python3 .github/ci/validate_repository.py links --external-links 2>&1 \
            | sed 's/^::error /::warning /'
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### External link advisory"
              echo
              echo "Third-party URLs were not all verified. External network drift is advisory, not a required merge gate."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All probed external links responded successfully." >> "$GITHUB_STEP_SUMMARY"
          fi

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - validator-quality
      - repository-validation
      - release-archive
      - markdown-lint
      - workflow-lint
    steps:
      - name: Enforce required job results
        run: |
          set -euo pipefail
          declare -A results=(
            [validator-quality]="${{ needs.validator-quality.result }}"
            [repository-validation]="${{ needs.repository-validation.result }}"
            [release-archive]="${{ needs.release-archive.result }}"
            [markdown-lint]="${{ needs.markdown-lint.result }}"
            [workflow-lint]="${{ needs.workflow-lint.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job finished with result '$result'"
              failed=1
            fi
          done
          exit "$failed"
