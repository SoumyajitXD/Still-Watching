name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate repository baseline
        shell: bash
        run: |
          errors=0

          report_error() {
            local path="$1"
            local message="$2"
            echo "::error file=${path}::${message}"
            errors=1
          }

          require_file() {
            local path="$1"
            if [[ ! -f "$path" ]]; then
              report_error "$path" "Missing required file"
            fi
          }

          require_contains() {
            local path="$1"
            local pattern="$2"
            local description="$3"

            if [[ ! -f "$path" ]]; then
              report_error "$path" "Cannot check '${description}' because the file is missing"
              return
            fi

            if ! grep -q -- "$pattern" "$path"; then
              report_error "$path" "Missing required content: ${description}"
            fi
          }

          echo "::group::Required repository files"
          required_files=(
            README.md
            CONTRIBUTING.md
            SUPPORT.md
            SECURITY.md
            installation-guide.md
            curseforge-description.html
            LICENSE
            .github/workflows/ci.yml
          )

          for path in "${required_files[@]}"; do
            require_file "$path"
          done
          echo "::endgroup::"

          echo "::group::Workflow inventory"
          while IFS= read -r path; do
            report_error "$path" "Only .github/workflows/ci.yml should exist"
          done < <(find .github/workflows -type f ! -name ci.yml | sort)
          echo "::endgroup::"

          echo "::group::Deleted CI helper scripts"
          if [[ -d .github/scripts ]]; then
            while IFS= read -r path; do
              report_error "$path" "Old CI helper scripts should not remain"
            done < <(find .github/scripts -type f | sort)
          fi
          echo "::endgroup::"

          echo "::group::Required baseline content"
          require_contains .github/workflows/ci.yml '^permissions:$' "workflow declares permissions"
          require_contains .github/workflows/ci.yml '^  contents: read$' "workflow limits permissions to contents: read"
          require_contains README.md 'Still Watching' "project name Still Watching"
          require_contains README.md '1.20.1' "Minecraft version 1.20.1"
          require_contains README.md 'Forge' "Forge loader"
          require_contains README.md '1420406' "CurseForge project ID 1420406"
          require_contains README.md 'sponsor:bisecthosting:start' "BisectHosting sponsor start marker"
          require_contains README.md 'sponsor:bisecthosting:end' "BisectHosting sponsor end marker"
          require_contains curseforge-description.html 'url-shortener.curseforge.com' "CurseForge URL shortener sponsor link"
          echo "::endgroup::"

          if [[ "$errors" -eq 0 ]]; then
            echo "Repository baseline passed."
          else
            echo "Repository baseline failed. See annotations above for exact files and checks." >&2
          fi

          exit "$errors"

      - name: Check git whitespace
        run: git diff --check
