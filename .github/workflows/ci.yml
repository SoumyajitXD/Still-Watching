name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository baseline
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            CONTRIBUTING.md
            SUPPORT.md
            SECURITY.md
            CHANGELOG.md
            installation-guide.md
            curseforge-description.html
            LICENSE
            .github/workflows/ci.yml
          )

          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required file: $path" >&2
              exit 1
            fi
          done

          if find .github/workflows -type f ! -name ci.yml | grep -q .; then
            echo "Only .github/workflows/ci.yml should remain." >&2
            find .github/workflows -type f ! -name ci.yml >&2
            exit 1
          fi

          if [[ -d .github/scripts ]] && find .github/scripts -type f | grep -q .; then
            echo "Old CI helper scripts should not remain." >&2
            find .github/scripts -type f >&2
            exit 1
          fi

          grep -q '^permissions:$' .github/workflows/ci.yml
          grep -q '^  contents: read$' .github/workflows/ci.yml
          grep -q 'sponsor:bisecthosting:start' README.md
          grep -q 'sponsor:bisecthosting:end' README.md
          grep -q 'url-shortener.curseforge.com' curseforge-description.html
          grep -q '1420406' README.md
          grep -q '1.20.1' README.md
          grep -q 'Forge' README.md

          echo "Repository baseline passed."

      - name: Check git whitespace
        run: git diff --check
