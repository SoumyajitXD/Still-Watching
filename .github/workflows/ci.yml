name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
      - name: Validate required files, paths, and legacy script references
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py baseline

  metadata-consistency:
    name: Metadata consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
      - name: Validate project metadata across docs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py metadata modlist

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
      - name: Run markdownlint-cli2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes markdownlint-cli2@0.18.1 "**/*.md" "!Releases/**"

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
      - name: Validate internal links and probe external links
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py links --external-links

  html-validation:
    name: CurseForge HTML validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
      - name: Validate curseforge-description.html
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py html

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
      - name: Check whitespace, junk files, conflict markers, and secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py hygiene

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run actionlint and workflow security checks
        shell: bash
        run: |
          set -euo pipefail
          actionlint .github/workflows/ci.yml
          python3 .github/ci/validate_repository.py workflow
