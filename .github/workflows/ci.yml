name: Still Watching CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      external_links:
        description: Probe external HTTP(S) links during this manual run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_update_notifier: "false"
  GOTOOLCHAIN: local

jobs:
  repository-validation:
    name: Validate ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        check:
          - baseline
          - metadata
          - html
          - modlist
          - links
          - hygiene
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Run ${{ matrix.check }} validation
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py "${{ matrix.check }}"

  validator-quality:
    name: Validator quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Compile validation code and parse metadata
        run: |
          set -euo pipefail
          python3 -m compileall -q .github/ci
          python3 -m json.tool .github/ci/project-metadata.json >/dev/null
          python3 .github/ci/validate_repository.py all

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Select Markdown files
        id: markdown
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          candidates: set[str] = set()

          def changed_between(base: str, head: str) -> set[str]:
              if not base or not head or set(base) == {"0"}:
                  return set()
              result = subprocess.run(
                  ["git", "diff", "--name-only", "-z", "--diff-filter=ACMRT", base, head],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return {
                  item.decode("utf-8")
                  for item in result.stdout.split(b"\0")
                  if item
              }

          if event_name == "pull_request":
              candidates = changed_between(
                  event["pull_request"]["base"]["sha"],
                  event["pull_request"]["head"]["sha"],
              )
          elif event_name == "push":
              candidates = changed_between(event.get("before", ""), event.get("after", ""))
              if not candidates:
                  result = subprocess.run(
                      ["git", "ls-files", "-z", "*.md"],
                      check=True,
                      stdout=subprocess.PIPE,
                  )
                  candidates = {
                      item.decode("utf-8")
                      for item in result.stdout.split(b"\0")
                      if item
                  }
          else:
              result = subprocess.run(
                  ["git", "ls-files", "-z", "*.md"],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              candidates = {
                  item.decode("utf-8")
                  for item in result.stdout.split(b"\0")
                  if item
              }

          selected = sorted(
              path
              for path in candidates
              if path.lower().endswith(".md")
              and not path.startswith("Releases/")
              and Path(path).is_file()
          )

          output = Path(os.environ["RUNNER_TEMP"]) / "markdown-files"
          with output.open("wb") as handle:
              for path in selected:
                  handle.write(path.encode("utf-8") + b"\0")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("has-files=" + ("true" if selected else "false") + "\n")

          print("Markdown files selected:")
          for path in selected:
              print(f" - {path}")
          if not selected:
              print(" - none")
          PY

      - name: Install markdownlint-cli2
        if: steps.markdown.outputs.has-files == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install \
              --prefix "$RUNNER_TEMP/markdownlint" \
              --no-save \
              --package-lock=false \
              --ignore-scripts \
              markdownlint-cli2@0.18.1; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install markdownlint-cli2 after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Lint selected Markdown
        if: steps.markdown.outputs.has-files == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/markdownlint-cli2.yaml" <<'YAML'
          config:
            default: true
            MD013: false
            MD033: false
            MD036: false
            MD041: false
            MD047: false
            MD024:
              siblings_only: true
            MD026:
              punctuation: ".,;:!！?？"
          YAML

          mapfile -d '' files < "$RUNNER_TEMP/markdown-files"
          "$RUNNER_TEMP/markdownlint/node_modules/.bin/markdownlint-cli2" \
            --config "$RUNNER_TEMP/markdownlint-cli2.yaml" \
            "${files[@]}"

      - name: Report no Markdown changes
        if: steps.markdown.outputs.has-files != 'true'
        run: |
          set -euo pipefail
          echo "No Markdown files require linting."

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install actionlint after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate workflow syntax and policy
        run: |
          set -euo pipefail
          actionlint .github/workflows/ci.yml
          python3 .github/ci/validate_repository.py workflow

  external-link-check:
    name: External link check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.external_links)
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Probe external links
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py links --external-links

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - repository-validation
      - validator-quality
      - markdown-lint
      - workflow-lint
    steps:
      - name: Enforce required job results
        run: |
          set -euo pipefail

          declare -A results=(
            [repository-validation]="${{ needs.repository-validation.result }}"
            [validator-quality]="${{ needs.validator-quality.result }}"
            [markdown-lint]="${{ needs.markdown-lint.result }}"
            [workflow-lint]="${{ needs.workflow-lint.result }}"
          )

          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job finished with result '$result'"
              failed=1
            fi
          done
          exit "$failed"
