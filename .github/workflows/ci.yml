name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      external_links:
        description: "Probe external HTTP(S) links during this manual run."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_update_notifier: "false"
  GOTOOLCHAIN: local

jobs:
  repository-validation:
    name: Repository validation (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            checks: baseline
          - name: modlist
            checks: modlist
          - name: hygiene
            checks: hygiene
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Run ${{ matrix.name }} checks
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py ${{ matrix.checks }}

  metadata-consistency:
    name: Metadata consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Validate documentation metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          metadata_path = Path(".github/ci/project-metadata.json")
          targets = [
              Path("README.md"),
              Path("installation-guide.md"),
              Path("SUPPORT.md"),
              Path("CONTRIBUTING.md"),
              Path("latest-modlist.md"),
          ]
          labels = {
              "project_name": "project name",
              "minecraft_version": "Minecraft version",
              "loader": "loader",
              "java_version": "Java version",
              "curseforge_project_id": "CurseForge project ID",
              "current_documented_release": "current documented release",
              "minimum_ram": "minimum RAM",
              "preferred_ram": "preferred RAM",
          }
          errors = 0

          def error(path: Path, message: str) -> None:
              global errors
              errors += 1
              print(f"::error file={path}::{message}")

          def normalize(text: str) -> str:
              return (
                  text.replace("&ndash;", "–")
                  .replace("&#8211;", "–")
                  .replace("&mdash;", "—")
                  .replace("&#8212;", "—")
                  .replace("&nbsp;", " ")
                  .replace("5GB", "5 GB")
                  .replace("6–8GB", "6–8 GB")
                  .replace("6-8 GB", "6–8 GB")
                  .replace("Apache License 2.0", "Apache-2.0")
              )

          def candidates(key: str, value: str) -> list[str]:
              values = [value]
              if key == "current_documented_release" and value.startswith("Still Watching "):
                  short_version = value.removeprefix("Still Watching ")
                  values.extend(
                      [
                          short_version,
                          f"Current release {short_version}",
                          f"Current documented release {short_version}",
                      ]
                  )
              if key == "java_version":
                  values.extend([f"Java {value}", f"Java `{value}`"])
              if key in {"minimum_ram", "preferred_ram"}:
                  values.append(value.replace(" ", ""))
              if key == "loader":
                  values.append(value.lower())
              return values

          if not metadata_path.is_file():
              error(metadata_path, "Missing metadata source of truth")
              sys.exit(1)

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          for key, label in labels.items():
              if not metadata.get(key):
                  error(metadata_path, f"Missing metadata key: {key} ({label})")

          for path in targets:
              if not path.is_file():
                  error(path, "Missing metadata-bearing documentation file")
                  continue
              text = normalize(path.read_text(encoding="utf-8"))
              for key, label in labels.items():
                  value = metadata.get(key, "")
                  accepted = candidates(key, value) if value else []
                  if accepted and not any(candidate in text for candidate in accepted):
                      error(
                          path,
                          f"Missing metadata value for {label}; accepted one of: "
                          + ", ".join(repr(candidate) for candidate in accepted),
                      )

          print(f"Metadata validation finished with {errors} error(s).")
          sys.exit(1 if errors else 0)
          PY

  curseforge-html:
    name: CurseForge HTML validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Validate HTML structure and safety
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import html.parser
          import re
          import sys
          import urllib.parse
          from pathlib import Path

          path = Path("curseforge-description.html")
          errors = 0
          warnings = 0

          def error(message: str, line: int | None = None) -> None:
              global errors
              errors += 1
              location = f"file={path}"
              if line is not None:
                  location += f",line={line}"
              print(f"::error {location}::{message}")

          def warning(message: str, line: int | None = None) -> None:
              global warnings
              warnings += 1
              location = f"file={path}"
              if line is not None:
                  location += f",line={line}"
              print(f"::warning {location}::{message}")

          if not path.is_file():
              error("Missing CurseForge description HTML")
              sys.exit(1)

          text = path.read_text(encoding="utf-8")
          if not text.strip():
              error("CurseForge description HTML is empty")
              sys.exit(1)

          class Validator(html.parser.HTMLParser):
              forbidden_tags = {"script", "style", "iframe", "object", "embed", "form"}

              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.images = 0
                  self.links = 0

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  tag = tag.lower()
                  attributes = {name.lower(): value for name, value in attrs}
                  line, _ = self.getpos()

                  if tag in self.forbidden_tags:
                      error(f"Forbidden HTML tag: <{tag}>", line)

                  for attribute in ("href", "src"):
                      value = attributes.get(attribute)
                      if not value:
                          continue
                      if value.startswith("//"):
                          error(f"Protocol-relative {attribute} is not allowed: {value}", line)
                          continue
                      scheme = urllib.parse.urlparse(value).scheme.lower()
                      if scheme and scheme not in {"https", "mailto"}:
                          error(f"Unsupported {attribute} scheme '{scheme}': {value}", line)

                  if tag == "img":
                      self.images += 1
                      if not attributes.get("src"):
                          error("Image is missing a src attribute", line)
                      if "alt" not in attributes:
                          warning("Image is missing an alt attribute", line)

                  if tag == "a":
                      self.links += 1
                      if not attributes.get("href"):
                          error("Link is missing an href attribute", line)
                      if attributes.get("target") == "_blank":
                          rel = set((attributes.get("rel") or "").lower().split())
                          missing = {"noopener", "nofollow"} - rel
                          if missing:
                              warning(
                                  "target='_blank' link is missing rel token(s): "
                                  + ", ".join(sorted(missing)),
                                  line,
                              )

          parser = Validator()
          try:
              parser.feed(text)
              parser.close()
          except Exception as exc:
              error(f"HTML parser rejected the description: {exc}")

          required_markers = {
              "project name": "Still Watching",
              "Minecraft version": "1.20.1",
              "loader": "Forge",
              "current release": "Still Watching V2.0.0",
              "server sponsor link": "https://url-shortener.curseforge.com/AZDOs",
          }
          for label, marker in required_markers.items():
              if marker not in text:
                  error(f"Missing required {label}: {marker}")

          if re.search(r"\b(?:TODO|FIXME|TBD|LOREM IPSUM|PLACEHOLDER)\b", text, re.IGNORECASE):
              error("Placeholder text remains in the release-facing description")
          if "http://" in text.lower():
              error("Release-facing HTML contains an insecure HTTP URL")
          if parser.images == 0:
              error("CurseForge description must contain at least one image")
          if parser.links == 0:
              error("CurseForge description must contain at least one link")

          print(
              f"CurseForge HTML validation finished with "
              f"{errors} error(s) and {warnings} warning(s)."
          )
          sys.exit(1 if errors else 0)
          PY

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Install markdownlint-cli2 with retries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --prefix "$RUNNER_TEMP/markdownlint" --no-save --package-lock=false --ignore-scripts markdownlint-cli2@0.18.1; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install markdownlint-cli2 after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Run markdownlint-cli2
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/markdownlint/node_modules/.bin/markdownlint-cli2" "**/*.md" "!Releases/**"

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Validate internal links
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py links

  external-link-check:
    name: External link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.external_links)
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Probe external links
        run: |
          set -euo pipefail
          python3 .github/ci/validate_repository.py links --external-links

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to immutable commit
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Install actionlint with retries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install actionlint after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run actionlint and workflow security checks
        run: |
          set -euo pipefail
          actionlint .github/workflows/*.yml
          python3 .github/ci/validate_repository.py workflow

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - repository-validation
      - metadata-consistency
      - curseforge-html
      - markdown-lint
      - link-check
      - workflow-lint
    if: always()
    steps:
      - name: Check required job results
        run: |
          set -euo pipefail
          failed=0
          declare -A results=(
            [repository-validation]="${{ needs.repository-validation.result }}"
            [metadata-consistency]="${{ needs.metadata-consistency.result }}"
            [curseforge-html]="${{ needs.curseforge-html.result }}"
            [markdown-lint]="${{ needs.markdown-lint.result }}"
            [link-check]="${{ needs.link-check.result }}"
            [workflow-lint]="${{ needs.workflow-lint.result }}"
          )

          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job finished with result '$result'"
              failed=1
            fi
          done

          exit "$failed"
