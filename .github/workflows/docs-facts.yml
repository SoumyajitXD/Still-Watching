name: Documentation facts guard

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docs-facts:
    name: Check documentation facts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan docs for factual contradictions
        run: python .github/scripts/docs_facts.py
