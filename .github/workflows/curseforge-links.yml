name: CurseForge link sanity

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  curseforge-links:
    name: Validate CurseForge links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate CurseForge URL shapes
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import re
          import sys
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlparse

          DOC_EXTENSIONS = {".md", ".markdown", ".html", ".htm"}
          ALLOWED_PREFIXES = (
              "/minecraft/mc-mods/",
              "/minecraft/modpacks/",
              "/minecraft/shaders/",
              "/minecraft/texture-packs/",
          )
          URL_RE = re.compile(r"https?://[^\s<>()\[\]{}\"']+", re.IGNORECASE)
          TABLE_ROW_RE = re.compile(r"^\s*\|.+\|\s*$")
          MIN_ABSOLUTE_LINKS = 10
          MIN_LINK_TO_ROW_RATIO = 0.75

          root = Path.cwd()
          failures: list[str] = []

          def iter_docs() -> list[Path]:
              docs: list[Path] = []
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if ".git" in path.parts:
                      continue
                  if path.suffix.lower() in DOC_EXTENSIONS:
                      docs.append(path)
              return sorted(docs)

          def clean_url(raw: str) -> str:
              return raw.rstrip(".,;:!?)]}>")

          def is_curseforge_host(host: str) -> bool:
              host = host.lower()
              return host == "curseforge.com" or host.endswith(".curseforge.com")

          def normalized_project_url(raw: str) -> str:
              parsed = urlparse(raw)
              path = parsed.path.rstrip("/")
              return f"{parsed.scheme.lower()}://{parsed.netloc.lower()}{path}"

          def validate_curseforge_url(path: Path, line_no: int, raw: str) -> str | None:
              parsed = urlparse(raw)
              host = parsed.netloc.lower()
              if not is_curseforge_host(host):
                  return None

              if parsed.scheme != "https":
                  return f"{path}:{line_no}: CurseForge URL must use https: {raw}"

              if host not in {"www.curseforge.com", "curseforge.com"}:
                  return f"{path}:{line_no}: unexpected CurseForge host: {raw}"

              if not any(parsed.path.startswith(prefix) for prefix in ALLOWED_PREFIXES):
                  return (
                      f"{path}:{line_no}: unsupported CurseForge path. "
                      f"Expected one of {', '.join(ALLOWED_PREFIXES)}: {raw}"
                  )

              # Project-page shape only: /minecraft/<type>/<slug>, with an optional trailing slash.
              trimmed = parsed.path.rstrip("/")
              if len(trimmed.split("/")) != 4:
                  return f"{path}:{line_no}: malformed CurseForge project URL: {raw}"

              slug = trimmed.rsplit("/", 1)[-1]
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]*[a-z0-9]", slug):
                  return f"{path}:{line_no}: malformed CurseForge slug: {raw}"

              return None

          docs = iter_docs()
          curseforge_urls_by_file: dict[Path, list[str]] = {}

          for doc in docs:
              text = doc.read_text(encoding="utf-8", errors="replace")
              urls: list[str] = []
              for line_no, line in enumerate(text.splitlines(), start=1):
                  for match in URL_RE.finditer(line):
                      url = clean_url(match.group(0))
                      parsed = urlparse(url)
                      if is_curseforge_host(parsed.netloc):
                          urls.append(url)
                          error = validate_curseforge_url(doc.relative_to(root), line_no, url)
                          if error:
                              failures.append(error)
              curseforge_urls_by_file[doc] = urls

          latest_modlist = root / "latest-modlist.md"
          if latest_modlist.exists():
              latest_text = latest_modlist.read_text(encoding="utf-8", errors="replace")
              latest_urls = [
                  clean_url(match.group(0))
                  for match in URL_RE.finditer(latest_text)
                  if is_curseforge_host(urlparse(clean_url(match.group(0))).netloc)
              ]
              normalized_urls = [normalized_project_url(url) for url in latest_urls]
              duplicates = sorted(url for url, count in Counter(normalized_urls).items() if count > 1)

              if duplicates:
                  failures.append(
                      "latest-modlist.md contains duplicate CurseForge links:\n"
                      + "\n".join(f"  - {url}" for url in duplicates)
                  )

              table_rows = [
                  line
                  for line in latest_text.splitlines()
                  if TABLE_ROW_RE.match(line)
                  and not re.match(r"^\s*\|\s*-+", line)
                  and "Curseforge" not in line
              ]

              expected_floor = max(MIN_ABSOLUTE_LINKS, int(len(table_rows) * MIN_LINK_TO_ROW_RATIO))
              if len(latest_urls) < expected_floor:
                  failures.append(
                      "latest-modlist.md has too few CurseForge links: "
                      f"found {len(latest_urls)}, expected at least {expected_floor} "
                      f"based on {len(table_rows)} modlist rows."
                  )
          else:
              failures.append("latest-modlist.md is missing; cannot check CurseForge link health.")

          if failures:
              print("CurseForge link sanity check failed:")
              print("\n".join(f"- {failure}" for failure in failures))
              sys.exit(1)

          total_links = sum(len(urls) for urls in curseforge_urls_by_file.values())
          print(f"Checked {len(docs)} Markdown/HTML files and {total_links} CurseForge links.")
          print("CurseForge link sanity check passed.")
          PY
