name: Markdown quality

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  markdown-quality:
    name: Check Markdown hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Markdown files
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          ROOT = Path.cwd()

          # Keep this aligned with .github/scripts/validate.py. These are documented
          # optional navigation targets, not mandatory docs.
          OPTIONAL_LOCAL_TARGETS = {
              "docs/server-pack-guide.md",
              "docs/server-pack-guide.md#server-pack-baseline",
              "Screenshots",
              "Releases",
          }

          LINK_PATTERN = re.compile(r"(?<!!)\[[^\]\n]+\]\(([^)\n]+)\)")
          TRAILING_WHITESPACE = re.compile(rb"[ \t]+(?:\r?\n|$)")


          def git_markdown_files() -> list[Path]:
              result = subprocess.run(
                  ["git", "ls-files", "*.md", "*.markdown"],
                  cwd=ROOT,
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              )
              return [ROOT / line for line in result.stdout.splitlines() if line]


          def normalize_local_target(href: str) -> str:
              target = href.split("?", 1)[0]
              if target.startswith("./"):
                  target = target[2:]
              return target.rstrip("/")


          def is_optional_local_target(href: str) -> bool:
              normalized = normalize_local_target(href)
              without_anchor = normalized.split("#", 1)[0]
              return normalized in OPTIONAL_LOCAL_TARGETS or without_anchor in OPTIONAL_LOCAL_TARGETS


          def parse_markdown_href(raw_href: str) -> str:
              href = raw_href.strip()
              if href.startswith("<") and href.endswith(">"):
                  href = href[1:-1].strip()
              # Markdown allows an optional quoted title after whitespace.
              match = re.match(r"([^\s]+)(?:\s+['\"(].*)?$", href)
              return match.group(1) if match else href


          def should_skip_link(href: str) -> bool:
              if not href or href.startswith("#"):
                  return True
              parsed = urlparse(href)
              if parsed.scheme or parsed.netloc:
                  return True
              return href.startswith(("mailto:", "tel:", "data:"))


          def check_file_hygiene(path: Path, data: bytes, errors: list[str]) -> None:
              rel = path.relative_to(ROOT).as_posix()
              if not data:
                  errors.append(f"{rel}: empty Markdown file")
                  return
              if b"\r\n" in data:
                  errors.append(f"{rel}: CRLF line endings found")
              if not data.endswith(b"\n"):
                  errors.append(f"{rel}: missing final newline")
              for index, line in enumerate(data.splitlines(keepends=True), 1):
                  if TRAILING_WHITESPACE.search(line):
                      errors.append(f"{rel}:{index}: trailing whitespace")
                      break


          def check_local_links(path: Path, text: str, errors: list[str]) -> None:
              rel = path.relative_to(ROOT).as_posix()
              for match in LINK_PATTERN.finditer(text):
                  href = parse_markdown_href(match.group(1))
                  if should_skip_link(href):
                      continue

                  target = unquote(href.split("#", 1)[0].split("?", 1)[0])
                  if not target:
                      continue

                  resolved = (ROOT / target.lstrip("/")) if target.startswith("/") else (path.parent / target)
                  resolved = resolved.resolve()

                  try:
                      resolved.relative_to(ROOT.resolve())
                  except ValueError:
                      line = text.count("\n", 0, match.start(1)) + 1
                      errors.append(f"{rel}:{line}: local link escapes repository: {href}")
                      continue

                  if not resolved.exists() and not is_optional_local_target(href):
                      line = text.count("\n", 0, match.start(1)) + 1
                      errors.append(f"{rel}:{line}: broken local link: {href}")


          def main() -> int:
              errors: list[str] = []
              files = git_markdown_files()

              if not files:
                  print("No tracked Markdown files found.")
                  return 0

              for path in files:
                  data = path.read_bytes()
                  check_file_hygiene(path, data, errors)
                  text = data.decode("utf-8-sig", errors="replace")
                  check_local_links(path, text, errors)

              if errors:
                  print("Markdown hygiene checks failed:", file=sys.stderr)
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  return 1

              print(f"Markdown hygiene checks passed for {len(files)} file(s).")
              return 0


          raise SystemExit(main())
          PY
