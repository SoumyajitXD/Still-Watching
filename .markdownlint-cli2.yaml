# One shared configuration for local and GitHub Actions lint.
# The CLI supplies tracked Markdown paths explicitly; do not add globs here.
config:
  default: true
  MD013: false # Long mod tables and documentation prose are intentional.
  MD033: false # GitHub and CurseForge docs contain inline HTML.
  MD036: false # Release callouts use emphasized labels.
  MD041: false # Some documents begin with HTML.
  MD047: false # Legacy docs may omit a trailing newline.
  MD024:
    siblings_only: true
  MD026:
    punctuation: ".,;:!！?？"
